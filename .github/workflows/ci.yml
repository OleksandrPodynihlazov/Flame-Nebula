name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env and htpasswd
        run: |
          cp .env.example .env
          docker run --rm httpd:2.4-alpine htpasswd -nbB ci ci > infra/nginx/htpasswd

      - name: Validate compose file
        run: docker compose config -q

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Read Playwright version
        id: pw
        run: |
          v="$(node -p "require('./e2e/package-lock.json').packages['node_modules/playwright-core']?.version ?? ''")"
          test -n "$v" || { echo "playwright-core version not found in e2e/package-lock.json" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Build and start stack (e2e deps and Chromium install in background)
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
          # The CI DB is empty, so the web build uses demo mocks for the map e2e tests.
          VITE_USE_MOCKS: "true"
        run: |
          (
            set -e
            start=$SECONDS
            cd e2e
            npm ci
            if [ "$PW_CACHE_HIT" = "true" ]; then
              # Runner image already has Chromium's libraries (install-deps only added fonts); apt only if launch fails.
              if node -e "require('@playwright/test').chromium.launch().then(b => b.close())"; then
                echo "cached Chromium launches -> skipped install-deps"
              else
                echo "missing system libs -> installed deps"
                npx playwright install-deps chromium-headless-shell
              fi
            else
              npx playwright install --with-deps --only-shell chromium
            fi
            echo "e2e install took $((SECONDS - start))s (browser cache hit: ${PW_CACHE_HIT:-false})"
          ) > /tmp/e2e-install.log 2>&1 &
          pw=$!
          docker compose build
          APP_VERSION=ci docker compose up -d
          if ! wait "$pw"; then
            echo "e2e install failed:" >&2
            cat /tmp/e2e-install.log
            exit 1
          fi
          echo "e2e install ok:"
          tail -5 /tmp/e2e-install.log

      - name: Wait for health (version ci)
        run: |
          for _ in $(seq 1 45); do
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:8090/api/health 2>/dev/null)" \
               && echo "$body" | grep -q '"version":"ci"'; then
              echo "ok: $body"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy in 90s" >&2
          exit 1

      - name: Re-apply db/init (must be safe to re-run, like every deploy does)
        run: bash infra/apply-db-schema.sh

      - name: Run Playwright against the stack
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8090
          EXPECTED_VERSION: ci
          CI: "true"
        run: npm run test:local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci
          path: e2e/playwright-report
          retention-days: 7

      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100
