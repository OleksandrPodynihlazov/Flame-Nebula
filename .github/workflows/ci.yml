name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env and htpasswd
        run: |
          cp .env.example .env
          docker run --rm httpd:2.4-alpine htpasswd -nbB ci ci > infra/nginx/htpasswd

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: APP_VERSION=ci docker compose up -d

      - name: Wait for health (version ci)
        run: |
          for _ in $(seq 1 45); do
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:8090/api/health 2>/dev/null)" \
               && echo "$body" | grep -q '"version":"ci"'; then
              echo "ok: $body"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy in 90s" >&2
          exit 1

      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
