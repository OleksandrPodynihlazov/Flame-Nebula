name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env and htpasswd
        run: |
          cp .env.example .env
          docker run --rm httpd:2.4-alpine htpasswd -nbB ci ci > infra/nginx/htpasswd

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: APP_VERSION=ci docker compose up -d

      - name: Wait for health (version ci)
        run: |
          for _ in $(seq 1 45); do
            if body="$(curl -fsS --max-time 5 http://127.0.0.1:8090/api/health 2>/dev/null)" \
               && echo "$body" | grep -q '"version":"ci"'; then
              echo "ok: $body"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become healthy in 90s" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against the stack
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:8090
          EXPECTED_VERSION: ci
          CI: "true"
        run: npm run test:local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci
          path: e2e/playwright-report
          retention-days: 7

      - name: Dump state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
