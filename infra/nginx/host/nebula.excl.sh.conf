# HOST nginx vhost (not a container). Install on the VPS:
#   sudo cp infra/nginx/host/nebula.excl.sh.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name nebula.excl.sh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nebula.excl.sh;

    ssl_certificate     /home/excl/ssl/excl.fullchain.pem;
    ssl_certificate_key /home/excl/ssl/excl.key;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/nebula.access.log;
    error_log  /var/log/nginx/nebula.error.log;

    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:8090;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering    off;
        proxy_read_timeout 1h;
    }
}
