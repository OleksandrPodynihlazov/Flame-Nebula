# In-stack gateway: the only container with a published port (127.0.0.1:8090).
# Host nginx terminates TLS and forwards here.

log_format gateway '$remote_addr - $remote_user [$time_iso8601] "$request" '
                   '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                   'ua="$http_user_agent"';

# Keep the scheme set by host nginx; fall back to this hop's scheme for local runs.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/ {
        proxy_pass http://api:3000;

        # Scoped to /api/: web gzips its own static files, and /logs/ streams SSE that must not be buffered.
        gzip              on;
        gzip_proxied      any;
        gzip_comp_level   5;
        gzip_min_length   1024;
        gzip_vary         on;
        gzip_types        application/json application/geo+json text/csv;
    }

    location /logs/ {
        auth_basic           "Flame-Nebula logs";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://dozzle:8080;

        # Dozzle streams over SSE/websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:80;
    }
}
