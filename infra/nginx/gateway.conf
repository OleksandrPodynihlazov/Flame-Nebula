# In-stack gateway: the only container with a published port (127.0.0.1:8090).
# Host nginx terminates TLS and forwards here.

log_format gateway '$remote_addr - $remote_user [$time_iso8601] "$request" '
                   '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                   'cache=$upstream_cache_status ua="$http_user_agent"';

# API answer cache. Data changes only on a manual load: clear it then (docs/deploy.md).
# Inside the container, so recreating gateway also empties it.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:20m max_size=500m inactive=30m use_temp_path=off;

# Keep the scheme set by host nginx; fall back to this hop's scheme for local runs.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Per-client key for the hotspots limit. Host nginx overwrites X-Real-IP with the real client
# address, and the gateway is only reachable through it (loopback port), so the header is trusted.
# Local runs without host nginx fall back to this hop's address.
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ''      $binary_remote_addr;
}

# Hotspots concurrency is limited in two classes. Each request gets a non-empty key in one class only;
# limit_conn does not count requests whose key is empty.
# - heavy (no bbox): whole-area / CSV answers, ~650 MiB of API heap at ~437k rows (limit ~2 GB).
# - light (bbox): map viewport, capped by the API at HOTSPOTS_BBOX_MAX_ROWS, ~10 ms.
# bbox is detected with a case-sensitive regex on the raw query string, not $arg_bbox: $arg_ matches
# names case-insensitively, so "BBOX=..." would pass as light here while the API sees no bbox at all.
map $args $hotspots_has_bbox {
    "~(^|&)bbox=[^&]" 1;
    default           "";
}
map $hotspots_has_bbox $hotspots_heavy_ip  { ""  $client_ip;   default ""; }
map $hotspots_has_bbox $hotspots_heavy_all { ""  $server_name; default ""; }
map $hotspots_has_bbox $hotspots_light_ip  { ""  "";           default $client_ip; }
map $hotspots_has_bbox $hotspots_light_all { ""  "";           default $server_name; }

limit_conn_zone $hotspots_heavy_ip  zone=hotspots_ip:1m;
limit_conn_zone $hotspots_heavy_all zone=hotspots_all:1m;
limit_conn_zone $hotspots_light_ip  zone=hotspots_light_ip:1m;
limit_conn_zone $hotspots_light_all zone=hotspots_light_all:1m;

server {
    listen 80;
    server_name _;

    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location /api/ {
        proxy_pass http://api:3000;

        # GET/HEAD 200 answers for 10 min, keyed by path + query string. The API sends no Cache-Control,
        # Set-Cookie or compression, so every answer is cacheable as is and gzip below applies to hits too.
        # The lock lets one request build an answer while identical ones wait (up to 30 s, then they
        # go to the API uncached). Errors (400, 503 busy) are never cached.
        proxy_cache              api;
        proxy_cache_key          $request_uri;
        proxy_cache_valid        200 10m;
        proxy_cache_lock         on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age     30s;
        proxy_cache_use_stale    updating;
        add_header               X-Cache-Status $upstream_cache_status always;

        # Scoped to /api/: web gzips its own static files, and /logs/ streams SSE that must not be buffered.
        gzip              on;
        gzip_proxied      any;
        gzip_comp_level   5;
        gzip_min_length   1024;
        gzip_vary         on;
        gzip_types        application/json application/geo+json text/csv;

        # Deploy polls version here: always live, never cached.
        location = /api/health {
            proxy_pass  http://api:3000;
            proxy_cache off;
        }

        # Grid answers are small and cached: no limit beyond the global ones. Inherits cache + gzip.
        location /api/hotspots/grid {
            proxy_pass http://api:3000;
        }

        # /api/hotspots and /api/hotspots.csv; inherits the cache and gzip settings above.
        # limit_conn runs in the preaccess phase, before the cache lookup in the content phase,
        # so a cache hit also holds a slot while it is sent (milliseconds). Accepted.
        location /api/hotspots {
            proxy_pass http://api:3000;

            limit_conn        hotspots_ip 2;
            limit_conn        hotspots_all 3;
            limit_conn        hotspots_light_ip 6;
            limit_conn        hotspots_light_all 20;
            limit_conn_status 503;
            error_page        503 = @busy;
        }
    }

    location @busy {
        default_type application/json;
        add_header   Retry-After 5 always;
        return 503 '{"error":"Server busy, try again in a moment"}';
    }

    location /logs/ {
        auth_basic           "Flame-Nebula logs";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://dozzle:8080;

        # Dozzle streams over SSE/websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://web:80;
    }
}
